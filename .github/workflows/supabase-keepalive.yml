name: Keep Supabase awake

# Free Supabase projects pause after 7 days without activity. This asks the database for one
# public lobby every three days so the project stays awake between game nights. It does nothing
# until the SUPABASE_URL and SUPABASE_ANON_KEY repository variables are set
# (docs/guides/supabase.md).

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_URL != '' }}
    steps:
      - name: Ask for one lobby
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$URL/rest/v1/lobbies?select=code&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "Supabase answered."
